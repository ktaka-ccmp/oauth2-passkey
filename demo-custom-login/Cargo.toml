[package]
name = "demo-custom-login"
version = { workspace = true }
edition = { workspace = true }

[features]
# E2E build flag (Playwright only). Mounts `POST /o2p/test/reset` via
# the library and skips loading `.env`. Never enable in production.
e2e-test = ["oauth2-passkey-axum/e2e-test"]

[dependencies]
oauth2-passkey-axum = { path = "../oauth2_passkey_axum", default-features = false }

askama = { workspace = true }
axum = { workspace = true }
dotenvy = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
