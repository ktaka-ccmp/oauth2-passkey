[book]
authors = ["oauth2-passkey contributors"]
language = "en"
src = "src"
title = "oauth2-passkey Documentation"

[build]
build-dir = "book"
create-missing = false

[output.html]
default-theme = "light"
preferred-dark-theme = "navy"
git-repository-url = "https://github.com/ktaka-ccmp/oauth2-passkey"
edit-url-template = "https://github.com/ktaka-ccmp/oauth2-passkey/edit/master/docs/{path}"

[output.html.search]
enable = true
limit-results = 30
teaser-word-count = 30
