name: Deploy Demo

on:
  push:
    branches: [dev]
    paths:
      - 'oauth2_passkey/**'
      - 'oauth2_passkey_axum/**'
      - 'demo-live/**'
      - '.github/workflows/deploy-demo.yml'

env:
  REGION: asia-northeast1
  SERVICE: oauth2-passkey-demo

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Build with Cloud Build
        run: gcloud builds submit --config=demo-live/cloudbuild.yaml

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy $SERVICE \
            --image ${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/demo/${{ env.SERVICE }} \
            --region ${{ env.REGION }} \
            --port 8080 \
            --allow-unauthenticated \
            --min-instances 1 \
            --env-vars-file demo-live/env.cloud-run.yaml \
            --set-secrets "OAUTH2_GOOGLE_CLIENT_ID=OAUTH2_GOOGLE_CLIENT_ID:latest,OAUTH2_GOOGLE_CLIENT_SECRET=OAUTH2_GOOGLE_CLIENT_SECRET:latest,AUTH_SERVER_SECRET=AUTH_SERVER_SECRET:latest"
