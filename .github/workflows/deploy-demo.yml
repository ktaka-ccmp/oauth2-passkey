name: Deploy Demo

on:
  push:
    branches: [dev]
    paths:
      - 'oauth2_passkey/**'
      - 'oauth2_passkey_axum/**'
      - 'demo-live/**'
      - '.github/workflows/deploy-demo.yml'

permissions:
  contents: read

env:
  REGION: asia-northeast1
  SERVICE: oauth2-passkey-demo

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # --- Docker build & push ---
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: asia-northeast1-docker.pkg.dev
          username: _json_key
          password: ${{ secrets.GCP_SA_KEY }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: demo-live/Dockerfile
          push: true
          tags: asia-northeast1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/demo/${{ env.SERVICE }}:latest
          cache-from: type=gha,scope=demo-live
          cache-to: type=gha,mode=max,scope=demo-live

      # --- Cloud Run deploy ---
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          gcloud run deploy "$SERVICE" \
            --image "${REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/demo/${SERVICE}" \
            --region "$REGION" \
            --port 8080 \
            --allow-unauthenticated \
            --min-instances 1 \
            --env-vars-file demo-live/env.cloud-run.yaml \
            --set-secrets "OAUTH2_GOOGLE_CLIENT_ID=OAUTH2_GOOGLE_CLIENT_ID:latest,OAUTH2_GOOGLE_CLIENT_SECRET=OAUTH2_GOOGLE_CLIENT_SECRET:latest,AUTH_SERVER_SECRET=AUTH_SERVER_SECRET:latest,OAUTH2_CUSTOM1_CLIENT_ID=OAUTH2_CUSTOM1_CLIENT_ID:latest,OAUTH2_CUSTOM1_CLIENT_SECRET=OAUTH2_CUSTOM1_CLIENT_SECRET:latest,OAUTH2_CUSTOM2_CLIENT_ID=OAUTH2_CUSTOM2_CLIENT_ID:latest,OAUTH2_CUSTOM2_CLIENT_SECRET=OAUTH2_CUSTOM2_CLIENT_SECRET:latest"
