name: CI

on:
  push:
    branches: [ master, develop ]
    paths-ignore:
      - '.claude/**'
  pull_request:
    branches: [ master, develop ]
    paths-ignore:
      - '.claude/**'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy

    - name: Cache dependencies
      uses: Swatinem/rust-cache@v2
      with:
        save-if: ${{ github.ref == 'refs/heads/master' || github.ref == 'refs/heads/develop' }}
        cache-on-failure: true

    - name: Check formatting
      run: cargo fmt --all -- --check

    - name: Run clippy
      run: cargo clippy --all-targets --all-features

  test:
    name: Test Suite
    needs: lint
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Cache dependencies
      uses: Swatinem/rust-cache@v2
      with:
        save-if: ${{ github.ref == 'refs/heads/master' || github.ref == 'refs/heads/develop' }}
        cache-on-failure: true

    - name: Test core library
      run: cargo test --verbose --manifest-path oauth2_passkey/Cargo.toml

    - name: Test axum integration (all features)
      run: cargo test --verbose --manifest-path oauth2_passkey_axum/Cargo.toml --all-features

    - name: Test axum integration (no default features)
      run: cargo test --verbose --manifest-path oauth2_passkey_axum/Cargo.toml --no-default-features

    - name: Test axum integration (login-ui only)
      run: cargo test --verbose --manifest-path oauth2_passkey_axum/Cargo.toml --no-default-features --features login-ui

    - name: Test axum integration (user-ui only)
      run: cargo test --verbose --manifest-path oauth2_passkey_axum/Cargo.toml --no-default-features --features user-ui

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Install cargo-audit
      uses: taiki-e/install-action@cargo-audit

    - name: Run security audit
      run: cargo audit --ignore RUSTSEC-2023-0071

  docs:
    name: Documentation
    needs: lint
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Cache dependencies
      uses: Swatinem/rust-cache@v2
      with:
        save-if: ${{ github.ref == 'refs/heads/master' || github.ref == 'refs/heads/develop' }}
        cache-on-failure: true

    - name: Build documentation
      run: |
        cargo doc --no-deps --manifest-path oauth2_passkey/Cargo.toml
        cargo doc --no-deps --manifest-path oauth2_passkey_axum/Cargo.toml --all-features
      env:
        RUSTDOCFLAGS: "-D warnings"

  msrv:
    name: Minimum Supported Rust Version
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install Rust 1.88
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: "1.88"

    - name: Cache dependencies
      uses: Swatinem/rust-cache@v2
      with:
        save-if: ${{ github.ref == 'refs/heads/master' || github.ref == 'refs/heads/develop' }}
        cache-on-failure: true

    - name: Check MSRV compatibility
      run: |
        cargo check --manifest-path oauth2_passkey/Cargo.toml
        cargo check --manifest-path oauth2_passkey_axum/Cargo.toml --all-features