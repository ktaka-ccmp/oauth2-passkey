[workspace]
members = [
    "demo-both",
    "demo-cross-origin",
    "demo-live",
    "demo-custom-login",
    "demo-oauth2",
    "demo-passkey",
    "demo-profile",
    "demo-todo",
    "oauth2_passkey_axum",
    "oauth2_passkey",
]

resolver = "2"

[workspace.package]
version = "0.6.0"
edition = "2024"

[workspace.dependencies]
# Common packages
askama = { version = "0.16.0" }
async-trait = "0.1.89"
axum = { version = "0.8", features = ["http2", "macros", "multipart"] }
axum-core = "0.5.6"
axum-extra = { version = "0.12.6", features = ["typed-header"] }
chrono = { version = "0.4.44", features = ["serde"] }
chrono-tz = "0.10.4"
dotenvy = "0.15.7"
headers = "0.4.1"
http = "1.4.0"
rustls = { version = "0.23.40", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sqlx = { version = "0.8", features = [
    "runtime-tokio",
    "sqlite",
    "postgres",
    "mysql",
    "chrono",
    "json",
    "uuid",
] }
subtle = "2.6"
thiserror = "2.0.18"
tokio = { version = "1.52", features = [
    "bytes",
    "fs",
    "io-std",
    "macros",
    "parking_lot",
    "rt-multi-thread",
    "signal-hook-registry",
    "socket2",
    "sync",
    "time",
    "tracing",
] }
tracing = "0.1.44"
urlencoding = "2.1.3"
uuid = { version = "1.23", features = ["v4"] }

### For oauth2_passkey_axum

### For oauth2_passkey
base64 = "0.22.1"
ciborium = { version = "0.2.2", features = ["std"] }
hmac = "0.13.0"
jsonwebtoken = { version = "10.3.0", features = ["rust_crypto"] }
oid-registry = "0.8.1"
proptest = "1.11.0"
redis = { version = "1.2.1", features = ["tokio-comp"] }
reqwest = { version = "0.13.3", default-features = false, features = [
    "rustls-no-provider", "charset", "http2", "json", "cookies", "form", "system-proxy",
] }
ring = { version = "0.17.14", features = ["std"] }
serial_test = "3.4.0"
sha2 = "0.11.0"
url = "2.5.8"
webpki = { version = "0.22.4", features = ["std"] }
webpki-roots = "1.0.7"
x509-parser = { version = "0.18.1", features = ["validate", "verify"] }
tower-http = { version = "0.6", features = ["cors", "fs"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

### Test dependencies
regex = "1.12"
