<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 220" width="300" height="220">
  <g transform="translate(110, 110)">
    <!-- OAuth2 cycle arrows -->
    <path d="M -16 -62 A 62 62 0 0 1 56 -24" stroke="#2a6ab5" stroke-width="14" fill="none" stroke-linecap="round"/>
    <polygon points="58,-6 72,-36 40,-30" fill="#2a6ab5"/>

    <path d="M 16 62 A 62 62 0 0 1 -56 24" stroke="#3a7a1a" stroke-width="14" fill="none" stroke-linecap="round"/>
    <polygon points="-58,6 -72,36 -40,30" fill="#3a7a1a"/>

    <!-- Key head -->
    <circle cx="0" cy="0" r="38" fill="none" stroke="#2a2a2a" stroke-width="14"/>
    <!-- Keyhole -->
    <circle cx="0" cy="-6" r="10" fill="#2a6ab5"/>
    <rect x="-6" y="-4" width="12" height="24" rx="3" fill="#2a6ab5"/>

    <!-- Key shaft -->
    <line x1="38" y1="0" x2="98" y2="0" stroke="#2a2a2a" stroke-width="14" stroke-linecap="round"/>
    <!-- Key teeth -->
    <line x1="74" y1="0" x2="74" y2="18" stroke="#2a2a2a" stroke-width="14" stroke-linecap="round"/>
    <line x1="92" y1="0" x2="92" y2="15" stroke="#2a2a2a" stroke-width="14" stroke-linecap="round"/>
  </g>
</svg>
