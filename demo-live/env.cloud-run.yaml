# Cloud Run environment variables for demo-live
# Usage: gcloud run deploy ... --env-vars-file demo-live/env.cloud-run.yaml
#
# Secrets (OAUTH2_GOOGLE_CLIENT_ID, OAUTH2_GOOGLE_CLIENT_SECRET, AUTH_SERVER_SECRET,
#          OAUTH2_CUSTOM1_CLIENT_ID, OAUTH2_CUSTOM1_CLIENT_SECRET    -> Auth0 slot,
#          OAUTH2_CUSTOM2_CLIENT_ID, OAUTH2_CUSTOM2_CLIENT_SECRET    -> Entra slot)
# are managed via Secret Manager, not this file.

# --- Core ---
ORIGIN: "https://passkey-demo.ccmp.jp"
RUST_LOG: info
O2P_DEMO_MODE: "true"
O2P_FEDCM: "true"
O2P_LOGIN_URL: "/login"
O2P_CUSTOM_CSS_URL: "/o2p/themes/theme-slate.css"

# --- Storage (ephemeral for demo) ---
GENERIC_DATA_STORE_TYPE: sqlite
GENERIC_DATA_STORE_URL: "sqlite:file:memdb1?mode=memory&cache=shared"
GENERIC_CACHE_STORE_TYPE: memory
GENERIC_CACHE_STORE_URL: unused

# --- OAuth2 ---
OAUTH2_RESPONSE_MODE: query

# Auth0 via Custom slot 1 with preset
OAUTH2_CUSTOM1_PRESET: auth0
OAUTH2_CUSTOM1_ISSUER_URL: "https://dev-newrxiuvdyykkjcr.jp.auth0.com"
OAUTH2_CUSTOM1_RESPONSE_MODE: form_post
OAUTH2_CUSTOM1_SCOPE: "openid+email+profile"

# Microsoft Entra ID via Custom slot 2 with preset. `/v2.0` suffix required.
# Replace <tenant-id> with either your tenant UUID (B2B) or
# 9188040d-6c67-4c5b-b112-36a304b66dad (personal MS accounts / B2C).
# Multi-tenant `common`/`organizations` aliases are not supported.
OAUTH2_CUSTOM2_PRESET: entra
OAUTH2_CUSTOM2_ISSUER_URL: "https://login.microsoftonline.com/9188040d-6c67-4c5b-b112-36a304b66dad/v2.0"
OAUTH2_CUSTOM2_RESPONSE_MODE: form_post     # default; uncomment to override
OAUTH2_CUSTOM2_SCOPE: "openid+email+profile" # default; uncomment to override

# --- Session ---
SESSION_COOKIE_NAME: "__Host-SessionId"
SESSION_COOKIE_MAX_AGE: "600"
SESSION_CONFLICT_POLICY: allow

# --- Passkey ---
O2P_PASSKEY_PROMOTION: ask
PASSKEY_ATTESTATION: direct
PASSKEY_AUTHENTICATOR_ATTACHMENT: none
PASSKEY_USER_VERIFICATION: discouraged
PASSKEY_REQUIRE_RESIDENT_KEY: "true"
PASSKEY_RESIDENT_KEY: required
PASSKEY_USER_HANDLE_UNIQUE_FOR_EVERY_CREDENTIAL: "false"
