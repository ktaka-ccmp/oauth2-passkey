[package]
name = "oauth2-passkey-axum"
version = { workspace = true }
edition = { workspace = true }
description = "Axum integration for oauth2-passkey authentication library"
license = "MIT OR Apache-2.0"
authors = ["Kimitoshi Takahashi <ktaka@ccmp.jp>"]
repository = "https://github.com/ktaka-ccmp/oauth2-passkey"
homepage = "https://github.com/ktaka-ccmp/oauth2-passkey"
documentation = "https://docs.rs/oauth2-passkey-axum"
keywords = ["oauth2", "passkey", "axum", "authentication", "web"]
categories = ["authentication", "web-programming"]
readme = "README.md"

[features]
default = ["login-ui", "user-ui", "admin-ui"]
login-ui = []
user-ui = []
admin-ui = []
cors = ["dep:tower-http"]
bundled-tls = ["oauth2-passkey/bundled-tls"]
# E2E build flag. Re-exports `reset_storage_for_test` and mounts
# `POST /o2p/test/reset`. Must NOT be enabled in production builds.
e2e-test = ["oauth2-passkey/e2e-test"]

[dependencies]
# Changed from workspace dependency to published crate version
oauth2-passkey = { path = "../oauth2_passkey" }
#oauth2-passkey = { version = "0.1.x" }

askama = { workspace = true }
axum = { workspace = true }
axum-extra = { workspace = true }
chrono = { workspace = true }
chrono-tz = { workspace = true }
http = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
subtle = { workspace = true }
tower-http = { workspace = true, optional = true }
tracing = { workspace = true }
urlencoding = { workspace = true }

[dev-dependencies]
base64 = { workspace = true }
ciborium = { workspace = true }
dotenvy = { workspace = true }
jsonwebtoken = { workspace = true }
mock-oidc = { path = "../mock-oidc" }
regex = { workspace = true }
reqwest = { workspace = true }
ring = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true }
tracing-subscriber = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }

[[test]]
name = "security"
path = "tests-security/lib.rs"
